# 本地精简分叉：基于 avif-decode 3.0.0（BSD-3-Clause，Kornel）。
# 变更：移除 bin/lodepng；rav1d 关闭默认 `asm` 特性，避免构建机需要 nasm（纯 Rust 路径，运行时零额外 DLL）。
[package]
edition = "2024"
rust-version = "1.98"
name = "avif-decode"
version = "3.0.0"
description = "Convert AVIF images to pixel data (AnyFile local fork without asm)"
license = "BSD-3-Clause"
publish = false

[lib]
name = "avif_decode"
path = "src/lib.rs"

[dependencies]
avif-parse = "2.1.0"
bytemuck = "1.25"
imgref = "1.12.3"
log = "0.4.34"
quick-error = "2.0.1"
rgb = { version = "0.8.53", features = ["bytemuck"], default-features = false }
yuv = "0.8.19"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies.rav1d]
version = "1.1.0"
default-features = false
features = ["bitdepth_8", "bitdepth_16"]
