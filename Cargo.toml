[package]
name = "anyfile"
version = "0.1.0"
edition = "2024"
description = "面向 Windows 平台的轻量、冷启动极快的开源多用途文件查看器"
license = "GPL-3.0-or-later"
readme = "GLOSSARY.md"
repository = "https://github.com/rt-game-440/any-file"
build = "build.rs"

[lib]
name = "anyfile"
path = "src/lib.rs"

[[bin]]
name = "anyfile"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lofty = "0.22"
notify = "8"
raw-window-handle = "0.6"
symphonia = { version = "0.5", features = [
    "aac",
    "adpcm",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "renderer-skia-opengl",
    "renderer-software",
    "raw-window-handle-06",
    "accessibility",
    "compat-1-2",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
